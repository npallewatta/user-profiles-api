name: Build and Deploy to AWS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: userapi
  CDK_STACK_NAME: UserApiEcsStack

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Built-in caching is cleaner than separate cache step

      - name: Build and Package
        run: mvn clean package # Combines compile/package for speed

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4 # UPDATED TO V4
        with:
          name: userapi-jar
          path: target/userapi-*.jar

  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4 # MATCHING V4
        with:
          name: userapi-jar
          path: target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # FIXED REFERENCE
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # FIXED REFERENCE
          aws-region: ${{ env.AWS_REGION }} # FIXED REFERENCE

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Use build-args if your Dockerfile needs to know the JAR filename
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use Node 20 for better CDK compatibility

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install infra dependencies
        working-directory: infra
        run: npm install

      - name: Deploy to AWS
        working-directory: infra
        run: |
          # Pass the dynamic image tag to your CDK Java code
          cdk deploy --all --require-approval never -c imageTag=${{ github.sha }}